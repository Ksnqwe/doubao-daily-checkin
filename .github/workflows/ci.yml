name: 测试

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 检查代码可导入
        run: python main.py --version

      - name: 检查配置缺失时能正常报错退出
        run: |
          set +e
          python main.py --check
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "缺少配置时应以退出码 2 结束，实际为 $code"
            exit 1
          fi
